[server]
maxUploadSize = 1024       # MB; dataset uploads up to 1 GB
maxMessageSize = 1024
headless = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0b1017"
secondaryBackgroundColor = "#121a26"
textColor = "#e6ebf2"
linkColor = "#7dd3fc"
borderColor = "#26313f"
codeBackgroundColor = "#111827"
baseRadius = "12px"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "JetBrains Mono, ui-monospace, monospace"

[theme.sidebar]
backgroundColor = "#0a0f17"
secondaryBackgroundColor = "#151d2b"
borderColor = "#243044"

[client]
toolbarMode = "minimal"
