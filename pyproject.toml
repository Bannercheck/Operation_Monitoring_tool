[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-sprint"
version = "0.2.0"
description = "Universal SRE ingestion + correlation engine: noise -> signals -> explained incidents -> tracked actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.35", "pandas>=2.0", "python-dateutil>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signal-sprint = "signal_sprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
