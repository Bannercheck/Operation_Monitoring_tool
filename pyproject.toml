[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-audit"
version = "0.1.0"
description = "Audit anomaly tracer for SAP Security Audit Logs, explained by a local Ollama model"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ollama-audit = "ollama_audit.cli:main"

[tool.setuptools.packages.find]
include = ["ollama_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
