[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchover"
version = "1.2.1"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13"]
description = "Universal SRE ingestion + correlation engine: noise -> signals -> explained incidents -> tracked actions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["streamlit>=1.42", "pandas>=1.5", "python-dateutil>=2.8", "Authlib>=1.3", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
watchover = "watchover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
