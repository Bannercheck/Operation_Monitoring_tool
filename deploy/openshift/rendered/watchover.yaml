spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: watchover
    app.kubernetes.io/instance: watchover
    app.kubernetes.io/component: app
  ports:
    - name: http                     # React interface + API (Route "ui")
      port: 8501
      targetPort: http
      protocol: TCP
    - name: ingest                   # Go receiver: agents, enrolment, agent files, RUM, OTLP/HTTP /v1/* (Route "ingest")
      port: 8600
      targetPort: ingest
      protocol: TCP
    - name: otlp-grpc                # OpenTelemetry OTLP/gRPC for in-cluster collectors
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      appProtocol: grpc
    - name: otlp-http                # OpenTelemetry OTLP/HTTP
      port: 4318
      targetPort: otlp-http
      protocol: TCP
