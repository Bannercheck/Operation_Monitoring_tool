# Source: watchover/templates/postgresql.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: watchover-postgresql
  namespace: watchover
  labels:
    app.kubernetes.io/name: watchover
    app.kubernetes.io/instance: watchover
    app.kubernetes.io/version: "1.59.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: watchover
    helm.sh/chart: watchover-0.1.0
    app.kubernetes.io/component: postgresql
spec:
  serviceName: watchover-postgresql
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: watchover
      app.kubernetes.io/instance: watchover
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchover
        app.kubernetes.io/instance: watchover
        app.kubernetes.io/version: "1.59.3"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: watchover
        helm.sh/chart: watchover-0.1.0
        app.kubernetes.io/component: postgresql
    spec:
      serviceAccountName: watchover
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60     # a clean shutdown checkpoint instead of crash recovery at the next start
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - {name: POSTGRESQL_USER, value: "watchover"}
            - {name: POSTGRESQL_DATABASE, value: "watchover"}
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: watchover-db, key: postgres-password}
            - {name: POSTGRESQL_MAX_CONNECTIONS, value: "100"}
            - {name: POSTGRESQL_SHARED_BUFFERS, value: "2GB"}
            - {name: POSTGRESQL_EFFECTIVE_CACHE_SIZE, value: "3GB"}
            - {name: TZ, value: "Europe/Istanbul"}
          volumeMounts:
            - {name: pghome, mountPath: /var/lib/pgsql}          # the image's passwd entry (nss_wrapper) and start-up files
            - {name: pgdata, mountPath: /var/lib/pgsql/data}
            - {name: pgrun, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true    # writes: the data volume, /var/run/postgresql, /tmp (and /var/lib/pgsql for rhel)
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:                     # initdb on the first start
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "watchover", "-d", "watchover", "-q"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "watchover", "-d", "watchover", "-q"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "watchover", "-d", "watchover", "-q"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: pghome
          emptyDir: {sizeLimit: 64Mi}
        - name: pgrun
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: watchover
          app.kubernetes.io/instance: watchover
          app.kubernetes.io/version: "1.59.3"
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/part-of: watchover
          helm.sh/chart: watchover-0.1.0
          app.kubernetes.io/component: postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
