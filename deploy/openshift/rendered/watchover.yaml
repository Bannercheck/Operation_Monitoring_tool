apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchover
  namespace: watchover
  labels:
    app.kubernetes.io/name: watchover
    app.kubernetes.io/instance: watchover
    app.kubernetes.io/version: "1.59.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: watchover
    helm.sh/chart: watchover-0.1.0
    app.kubernetes.io/component: app
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: watchover
      app.kubernetes.io/instance: watchover
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchover
        app.kubernetes.io/instance: watchover
        app.kubernetes.io/version: "1.59.3"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: watchover
        helm.sh/chart: watchover-0.1.0
        app.kubernetes.io/component: app
      annotations:
        checksum/settings: b335eb7408edb0053f43949d52e20c7efba950a8527bb2278bf0fc231d4a70b6
    spec:
      serviceAccountName: watchover
      automountServiceAccountToken: false
      enableServiceLinks: false             # no WATCHOVER_PORT=tcp://… style variables next to the app's own WATCHOVER_* settings
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/watchover/watchover:1.59.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Istanbul"
            - name: HOME
              value: /tmp
            - name: WATCHOVER_FORWARDED_ALLOW               # behind the OpenShift router: its X-Forwarded-For / -Proto are believed
              value: "*"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: watchover-db
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgresql://watchover:$(POSTGRES_PASSWORD)@watchover-postgresql:5432/watchover"
            - name: WATCHOVER_RECEIVER
              value: go
            - name: WATCHOVER_API_RECEIVER
              value: "1"
            - name: WATCHOVER_INTERNAL_PORT
              value: "8601"
            - name: WATCHOVER_GO_PARSE
              value: "1"
            - name: WATCHOVER_SELFMON
              value: "1"
            - name: WATCHOVER_LOG_HOT_DIR
              value: /logs/hot
            - name: WATCHOVER_LOG_COLD_DIR
              value: /logs/cold
            - name: WATCHOVER_SETTINGS
              value: "{\"cold_max_gb\":0,\"cold_retention_days\":365,\"history_retention_days\":400,\"hot_max_gb\":40,\"live_retention_h\":48,\"llm_base\":\"\",\"llm_embed\":\"\",\"llm_key\":\"\",\"llm_model\":\"\",\"public_host\":\"https://watchover.apps.example.com\",\"train_auto\":false,\"x_llm_probed\":true}"
            - name: WATCHOVER_INGEST_URL
              value: "https://watchover-ingest.apps.example.com"
            - name: WATCHOVER_KEYD                # the action agent's keys live in the keyd container (docs/design/action-agent.md §9.3.1)
              value: unix:/run/keyd/keyd.sock
            - name: WATCHOVER_VAULT_DIR         # the vault key, off /data and its backups
              value: /secrets
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs-hot, mountPath: /logs/hot}
            - {name: logs-cold, mountPath: /logs/cold}
            - {name: tmp, mountPath: /tmp}
            - {name: keyd-sock, mountPath: /run/keyd}
            - {name: secrets, mountPath: /secrets}
          resources:
            limits:
              cpu: "6"
              memory: 16Gi
            requests:
              cpu: "2"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:                     # first start: database migrations; later starts are seconds
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
        - name: keyd                              # watchover-keyd: only this container mounts the keys volume (I17)
          image: image-registry.openshift-image-registry.svc:5000/watchover/watchover:1.59.3
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "watchover.act.keyd", "serve", "--dir", "/keys/store", "--unix", "/run/keyd/keyd.sock"]
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - {name: keys, mountPath: /keys}
            - {name: keyd-sock, mountPath: /run/keyd}
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            exec:
              command: ["python", "-c", "import socket; s = socket.socket(socket.AF_UNIX); s.connect('/run/keyd/keyd.sock')"]
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["python", "-c", "import socket; s = socket.socket(socket.AF_UNIX); s.connect('/run/keyd/keyd.sock')"]
            periodSeconds: 30
            timeoutSeconds: 5
        - name: receiver
          image: image-registry.openshift-image-registry.svc:5000/watchover/watchover-receiver:1.59.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: ingest
              containerPort: 8600
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Istanbul"
            - name: HOME
              value: /tmp
            - name: WO_UPSTREAM
              value: http://127.0.0.1:8601
            - name: WO_SPOOL
              value: /data/spool
            - name: WO_MAX_BACKLOG_MB
              value: "1024"
            - name: WATCHOVER_GO_PARSE
              value: "1"
            - name: GOMEMLIMIT
              value: "1800MiB"
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp-receiver, mountPath: /tmp}
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet: {path: /health, port: ingest}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: ingest}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: watchover-data}
        - name: logs-hot
          persistentVolumeClaim: {claimName: watchover-logs-hot}
        - name: logs-cold
          persistentVolumeClaim: {claimName: watchover-logs-cold}
        - name: tmp
          emptyDir: {sizeLimit: 2Gi}
        - name: tmp-receiver
          emptyDir: {sizeLimit: 64Mi}
        - name: keys
          persistentVolumeClaim: {claimName: watchover-keys}
        - name: secrets
          persistentVolumeClaim: {claimName: watchover-secrets}
        - name: keyd-sock
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
