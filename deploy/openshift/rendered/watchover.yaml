# Watchover on OpenShift without Helm (oc apply). Generated from deploy/openshift/watchover with:
#   helm template watchover deploy/openshift/watchover -n watchover \
#     --set postgresql.existingSecret=watchover-db \
#     --set routes.ui.host=watchover.apps.example.com --set routes.ingest.host=watchover-ingest.apps.example.com
# Before applying (docs/KURULUM_OPENSHIFT.md, "Helm olmadan kurulum"):
#   1. oc new-project watchover   (other project name: replace "namespace: watchover" and the image paths below)
#   2. oc create secret generic watchover-db -n watchover --from-literal=postgres-password="$(openssl rand -hex 24)"
#   3. sed -i 's/apps\.example\.com/apps.<cluster domain>/g' watchover.yaml   and the storage classes if the default is not wanted
#   4. oc apply -f watchover.yaml
# No secret value is in this file. Regenerate it after a chart change instead of editing it by hand.
---
# Source: watchover/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: watchover-app
  namespace: watchover
  labels:
    app.kubernetes.io/name: watchover
    app.kubernetes.io/instance: watchover
    app.kubernetes.io/version: "1.59.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: watchover
    helm.sh/chart: watchover-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: watchover
      app.kubernetes.io/instance: watchover
      app.kubernetes.io/component: app
  policyTypes: [Ingress]
  ingress:
    - from:                                    # the OpenShift router (Routes ui / ingest)
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - {port: 8501, protocol: TCP}
        - {port: 8600, protocol: TCP}
