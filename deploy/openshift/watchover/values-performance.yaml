# Tam performans profili: dakikada ~100-150 bin satır, GPU yok.
#   helm upgrade --install watchover deploy/openshift/watchover -f deploy/openshift/watchover/values-performance.yaml -f benim-degerlerim.yaml
# İstek = sınır (Guaranteed QoS): pod yoğun anda CPU kısıtlamasına (throttling) uğramaz. Sıcak loglar ve PostgreSQL yerel NVMe/SSD
# blok depolamada olmalı (LVM Storage / Local Storage Operator); NFS / CephFS olmamalı. Pod'u az kalabalık, sabit bir düğüme koyun.

dashboard:
  resources:
    requests: {cpu: "6", memory: 16Gi}
    limits: {cpu: "6", memory: 16Gi}

receiver:
  resources:
    requests: {cpu: "2", memory: 2Gi}
    limits: {cpu: "2", memory: 2Gi}
  goMemLimit: 1800MiB
  maxBacklogMB: 4096

persistence:
  data: {size: 30Gi, storageClass: ""}           # hızlı sınıf
  logsHot: {size: 50Gi, storageClass: ""}        # yerel NVMe / SSD sınıfı (ör. "lvms-vg1")
  logsCold: {size: 450Gi, storageClass: ""}      # ucuz blok sınıfı; 100 bin satır/dk × 365 gün ≈ 400 GB arşiv (+ pay)

retention:
  liveRetentionH: 48
  coldRetentionDays: 365                          # denetim: 1 yıl; arşivi yalnız bu süre siler
  hotMaxGb: 40
  coldMaxGb: 0                                    # 0 = PVC'nin kendisi; %80 / %90 uyarı, silme yok

postgresql:
  storage: {size: 30Gi, storageClass: ""}        # yerel NVMe / SSD sınıfı
  resources:
    requests: {cpu: "2", memory: 8Gi}
    limits: {cpu: "2", memory: 8Gi}
  sharedBuffers: 2GB

# Pod'u ayrılmış düğüme sabitleyin (yöneticinin verdiği etiketle), örn.:
# nodeSelector: {watchover: "true"}
# tolerations: [{key: "dedicated", operator: "Equal", value: "watchover", effect: "NoSchedule"}]
