{{- /* Who may talk to whom: PostgreSQL and Ollama only from the Watchover pod (and the backup job for PostgreSQL); the Watchover
     pod's 8501 / 8600 from the OpenShift router (Routes) and from namespaces listed in networkPolicy.ingestNamespaces. */}}
{{- if .Values.networkPolicy.enabled }}
{{- $app := include "watchover.selector" (dict "root" . "component" "app") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "watchover.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watchover.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $app | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:                                    # the OpenShift router (Routes ui / ingest)
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - {port: 8501, protocol: TCP}
        - {port: 8600, protocol: TCP}
    {{- with .Values.networkPolicy.ingestNamespaces }}
    - from:                                    # in-cluster senders straight to the receiver (e.g. an OpenTelemetry collector)
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .name | quote }}
        {{- end }}
      ports:
        - {port: 8600, protocol: TCP}
    {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "watchover.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watchover.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "watchover.selector" (dict "root" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $app | nindent 14 }}
        {{- if .Values.backup.enabled }}
        - podSelector:
            matchLabels:
              {{- include "watchover.selector" (dict "root" . "component" "backup") | nindent 14 }}
        {{- end }}
      ports:
        - {port: 5432, protocol: TCP}
{{- end }}
{{- if .Values.llm.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "watchover.fullname" . }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watchover.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "watchover.selector" (dict "root" . "component" "ollama") | nindent 6 }}
  {{- if .Values.llm.ollama.allowEgress }}
  policyTypes: [Ingress]
  {{- else }}
  policyTypes: [Ingress, Egress]
  egress: []                                   # internal model only: no way out (pull the model first, then switch this off)
  {{- end }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $app | nindent 14 }}
      ports:
        - {port: 11434, protocol: TCP}
{{- end }}
{{- end }}
