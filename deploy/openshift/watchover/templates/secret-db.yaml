{{- /* PostgreSQL password: generated once (32 alphanumerics), kept across upgrades (lookup) and after uninstall (the data
     volume outlives the release). Never rendered when postgresql.existingSecret names your own Secret. */}}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
{{- $name := include "watchover.dbSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pw := "" }}
{{- if and $old $old.data (hasKey $old.data "postgres-password") }}
{{- $pw = index $old.data "postgres-password" | b64dec }}
{{- else }}
{{- $pw = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watchover.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $pw | b64enc | quote }}
{{- end }}
