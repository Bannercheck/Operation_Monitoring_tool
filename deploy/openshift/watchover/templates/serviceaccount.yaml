{{- /* Own service account: no API access, no token mounted; the restricted-v2 SCC applies (no extra SCC needed). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "watchover.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watchover.labels" . | nindent 4 }}
automountServiceAccountToken: false
