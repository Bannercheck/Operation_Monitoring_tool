apiVersion: v1
kind: Service
metadata:
  name: {{ include "watchover.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watchover.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    {{- include "watchover.selector" (dict "root" . "component" "app") | nindent 4 }}
  ports:
    - name: http                     # React interface + API (Route "ui")
      port: 8501
      targetPort: http
      protocol: TCP
    - name: ingest                   # Go receiver: agents, enrolment, agent files, RUM (Route "ingest")
      port: 8600
      targetPort: ingest
      protocol: TCP
