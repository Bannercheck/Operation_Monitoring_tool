# Watchover on Docker.  Copy .env.docker.example to .env (set POSTGRES_PASSWORD), then:  docker compose up -d
#   dashboard http://<host>:8501   receiver :8600   PostgreSQL is started next to it (volume watchover-pg)
#   update:   docker compose pull && docker compose up -d        (or: make docker-update)
#   logs:     docker compose logs -f dashboard
#   mcp:      docker compose --profile mcp up -d
#   external PostgreSQL: DATABASE_URL in .env and  docker compose up -d --no-deps dashboard
name: watchover
services:
  dashboard:
    image: ${WATCHOVER_IMAGE:-ghcr.io/bannercheck/watchover}:${WATCHOVER_TAG:-latest}
    build:
      context: .
      args:
        GIT_REV: ${GIT_REV:--}
        VERSION: ${WATCHOVER_TAG:-local}
    container_name: watchover
    restart: unless-stopped
    ports:
      - "${WATCHOVER_UI_PORT:-8501}:8501"          # dashboard
      - "${WATCHOVER_LIVE_PORT:-8600}:8600"        # receiver: agents and pull sources
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
      WATCHOVER_SELFMON: ${WATCHOVER_SELFMON:-1}
      WATCHOVER_PARALLEL: ${WATCHOVER_PARALLEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - watchover-data:/data                        # settings, tokens, databases, live spool, version snapshots, logs
      # OAuth providers (Google / Microsoft / Apple / OIDC) are written by System › Sign-in into /app/.streamlit/secrets.toml;
      # to keep them across image updates add:  - ./secrets.toml:/app/.streamlit/secrets.toml   (create the file first)
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_CPUS:-4}"
          memory: ${WATCHOVER_MEMORY:-4g}
        reservations:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mcp:
    profiles: [mcp]
    image: ${WATCHOVER_IMAGE:-ghcr.io/bannercheck/watchover}:${WATCHOVER_TAG:-latest}
    command: ["python", "mcp_server.py", "--http", "--port", "8765"]
    restart: unless-stopped
    ports: ["${WATCHOVER_MCP_PORT:-8765}:8765"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - watchover-data:/data
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  postgres:
    image: postgres:16-alpine
    container_name: watchover-postgres
    restart: unless-stopped
    ports:
      - "${WATCHOVER_PG_PORT:-127.0.0.1:5433}:5432"   # host-side access for psql / backups only (not exposed beyond localhost)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchover}
      POSTGRES_USER: ${POSTGRES_USER:-watchover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}     # set a real one in .env before the first start
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - watchover-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchover} -d ${POSTGRES_DB:-watchover}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_PG_CPUS:-2}"
          memory: ${WATCHOVER_PG_MEMORY:-2g}

volumes:
  watchover-data:
  watchover-pg:
