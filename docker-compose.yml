# Watchover on one server, entirely in Docker, built from this source tree:  ./watchover.sh install   (see docs/KURULUM_DOCKER.md)
#   dashboard (React interface + API, OpenAPI at /api/docs) http://<host>:8501   receiver :8600   PostgreSQL next to it (volume watchover-pg)
#   update:   copy the new source tree over this folder, then  ./watchover.sh update
#   mcp:      ./watchover.sh mcp on                          (our MCP server; MCP_API_KEY in .env; datasets in ./datasets)
#   legacy:   ./watchover.sh legacy on                       (the former Streamlit interface on :8502, same database; to be removed)
#   edge:     ./watchover.sh edge on <host>                  (Caddy: https://<host> for the company network, TLS from its own CA or ./certs)
#   external PostgreSQL: DATABASE_URL in .env and  docker compose up -d --no-deps dashboard
#   plain compose works too:  docker compose build && docker compose up -d
name: watchover
services:
  dashboard:
    image: ${WATCHOVER_IMAGE:-watchover}:${WATCHOVER_TAG:-local}
    build:
      context: .
      args:
        GIT_REV: ${GIT_REV:--}
        VERSION: ${WATCHOVER_TAG:-local}
    container_name: watchover
    command: ["python", "-m", "watchover.api", "--port", "8501"]
    restart: unless-stopped
    ports:
      - "${WATCHOVER_UI_PORT:-8501}:8501"          # React interface + API (docs at /api/docs)
      - "${WATCHOVER_LIVE_PORT:-8600}:8600"        # receiver: agents and pull sources
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
      WATCHOVER_SELFMON: ${WATCHOVER_SELFMON:-1}
      WATCHOVER_PARALLEL: ${WATCHOVER_PARALLEL:-}
      WATCHOVER_API_RECEIVER: "1"
      WATCHOVER_CORS: ${WATCHOVER_CORS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - watchover-data:/data                        # settings, tokens, databases, live spool, version snapshots, logs
      # OAuth providers (Google / Microsoft / Apple / OIDC) are written by System › Sign-in into /app/.streamlit/secrets.toml;
      # to keep them across image updates add:  - ./secrets.toml:/app/.streamlit/secrets.toml   (create the file first)
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_CPUS:-4}"
          memory: ${WATCHOVER_MEMORY:-4g}
        reservations:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mcp:
    profiles: [mcp]
    image: ${WATCHOVER_IMAGE:-watchover}:${WATCHOVER_TAG:-local}
    container_name: watchover-mcp
    command: ["python", "mcp_server.py", "--http", "--port", "8765"]
    restart: unless-stopped
    ports: ["${WATCHOVER_MCP_PORT:-8765}:8765"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
      MCP_API_KEY: ${MCP_API_KEY:-}                 # empty = open endpoint: keep the port on localhost or set a key
      WATCHOVER_DATASETS: /data/datasets
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - watchover-data:/data
      - ./datasets:/data/datasets:ro                # files that MCP clients analyse by relative name: analyze_dataset("log.zip")
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  legacy:
    profiles: [legacy]
    image: ${WATCHOVER_IMAGE:-watchover}:${WATCHOVER_TAG:-local}
    container_name: watchover-legacy
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8502", "--server.headless", "true", "--server.fileWatcherType", "none"]
    restart: unless-stopped
    ports: ["${WATCHOVER_LEGACY_PORT:-8502}:8502"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
      WATCHOVER_SELFMON: "0"
      LIVE_PORT: "8601"                            # its own receiver port: the product's receiver is on the dashboard container
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - watchover-data:/data
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  edge:
    profiles: [edge]
    image: caddy:2-alpine
    container_name: watchover-edge
    restart: unless-stopped
    ports:
      - "${WATCHOVER_EDGE_HTTPS_PORT:-443}:${WATCHOVER_EDGE_HTTPS_PORT:-443}"   # the only ports colleagues reach; UI / API and /ingest go through here
      - "${WATCHOVER_EDGE_HTTP_PORT:-80}:${WATCHOVER_EDGE_HTTP_PORT:-80}"       # redirect to https
    environment:
      WATCHOVER_EDGE_HOST: ${WATCHOVER_EDGE_HOST:-localhost}
      WATCHOVER_EDGE_HOSTS: ${WATCHOVER_EDGE_HOSTS:-localhost}
      WATCHOVER_EDGE_TLS: ${WATCHOVER_EDGE_TLS:-internal}
      WATCHOVER_EDGE_HTTPS_PORT: ${WATCHOVER_EDGE_HTTPS_PORT:-443}
      WATCHOVER_EDGE_HTTP_PORT: ${WATCHOVER_EDGE_HTTP_PORT:-80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro                           # company certificate (optional): watchover.crt + watchover.key
      - watchover-edge:/data                        # Caddy's own CA and issued certificates
    depends_on:
      - dashboard
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    container_name: watchover-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${WATCHOVER_LLM_KEEPALIVE:-30m}       # keep a model resident this long between requests
      OLLAMA_NUM_PARALLEL: ${WATCHOVER_LLM_PARALLEL:-1}        # concurrent requests per model (CPU-only: keep low)
      OLLAMA_MAX_LOADED_MODELS: ${WATCHOVER_LLM_MAX_MODELS:-2} # chat + embeddings resident at once
      OMP_NUM_THREADS: ${WATCHOVER_LLM_THREADS:-4}             # CPU threads for inference (= the cpus limit below)
    volumes:
      - watchover-ollama:/root/.ollama                        # downloaded models persist here; cache cleanup never touches them
      - watchover-models:/models:ro                           # adapters written by the trainer (legacy Modelfile import path)
    expose:
      - "11434"                                               # on the compose network as http://ollama:11434 (not published to the host)
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_LLM_CPUS:-4}"                    # watchover.sh sizes this to every CPU Docker sees (10 laptop, 32/64 server)
          memory: ${WATCHOVER_LLM_MEMORY:-8g}
        reservations:
          cpus: "1"
          memory: 2g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  trainer:
    profiles: [llm]
    image: ${WATCHOVER_IMAGE:-watchover}-trainer:${WATCHOVER_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.trainer
    container_name: watchover-trainer
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
      OLLAMA_URL: http://ollama:11434
      WATCHOVER_TRAIN_THREADS: ${WATCHOVER_TRAIN_THREADS:-3}
      WATCHOVER_MODELS_DIR: /models
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - watchover-data:/data                                    # settings (auto-learn switches), the run-now flag, live spool for the quality gate
      - watchover-hf:/hf                                        # base weights cache (downloaded once)
      - watchover-models:/models                                # adapters + Modelfiles, also visible to Ollama for the legacy import path
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_TRAIN_CPUS:-4}"                    # sized to the machine by watchover.sh; training is periodic, idle otherwise
          memory: ${WATCHOVER_TRAIN_MEMORY:-6g}
        reservations:
          cpus: "0.25"
          memory: 256m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  postgres:
    image: postgres:16-alpine
    container_name: watchover-postgres
    restart: unless-stopped
    ports:
      - "${WATCHOVER_PG_PORT:-127.0.0.1:5433}:5432"   # host-side access for psql / backups only (not exposed beyond localhost)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchover}
      POSTGRES_USER: ${POSTGRES_USER:-watchover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}     # set a real one in .env before the first start
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - watchover-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchover} -d ${POSTGRES_DB:-watchover}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_PG_CPUS:-2}"
          memory: ${WATCHOVER_PG_MEMORY:-2g}

volumes:
  watchover-data:
  watchover-pg:
  watchover-edge:
  watchover-ollama:
  watchover-hf:
  watchover-models:
