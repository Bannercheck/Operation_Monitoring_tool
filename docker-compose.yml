# Watchover on one server, entirely in Docker, built from this source tree:  ./watchover.sh install   (see docs/KURULUM_DOCKER.md)
#   dashboard (React interface + API, OpenAPI at /api/docs) http://<host>:8501   receiver :8600   PostgreSQL next to it (volume watchover-pg)
#   update:   copy the new source tree over this folder, then  ./watchover.sh update
#   mcp:      ./watchover.sh mcp on                          (our MCP server; MCP_API_KEY in .env; datasets in ./datasets)
#   legacy:   ./watchover.sh legacy on                       (the former Streamlit interface on :8502, same database; to be removed)
#   edge:     ./watchover.sh edge on <host>                  (nginx: https://<host> for the company network, TLS from this install's CA or ./certs)
#   external PostgreSQL: DATABASE_URL in .env and  docker compose up -d --no-deps dashboard
#   raw logs where you say: ./watchover.sh storage set --hot DIR --cold DIR (WATCHOVER_LOG_HOT_PATH / _COLD_PATH in .env, docker-compose.loghot.yml / .logcold.yml)
#   updater:  ./watchover.sh updater on|off                (on by default: in-app updates and rollbacks, Sistem › Güncelleme; the
#             'updater' service is the only one with the engine socket; the dashboard only shares the watchover-updates spool with it)
#   Podman (RHEL): the same file through podman.socket (WATCHOVER_ENGINE=podman); bind mounts carry :z for SELinux
#   plain compose works too:  docker compose build && docker compose up -d
name: watchover
services:
  dashboard:
    image: ${WATCHOVER_IMAGE:-watchover}:${WATCHOVER_TAG:-local}
    build:
      context: .
      args:
        GIT_REV: ${GIT_REV:--}
        VERSION: ${WATCHOVER_TAG:-local}
    container_name: watchover
    command: ["python", "-m", "watchover.api", "--port", "8501"]
    restart: unless-stopped
    ports:
      - "${WATCHOVER_UI_PORT:-8501}:8501"          # React interface + API (docs at /api/docs); agents use the receiver service (8600)
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
      WATCHOVER_SELFMON: ${WATCHOVER_SELFMON:-1}
      WATCHOVER_PARALLEL: ${WATCHOVER_PARALLEL:-}
      WATCHOVER_API_RECEIVER: "1"
      WATCHOVER_RECEIVER: go                        # the Go receiver owns :8600 and spools to /data/spool; this container consumes it
      WATCHOVER_GO_PARSE: ${WATCHOVER_GO_PARSE:-1}  # 1: the receiver parses allow-listed formats in Go (v=2 records); 0: this container parses everything; shadow: compare only
      WATCHOVER_INTERNAL_PORT: "8601"               # enrolment (proxied by the receiver) and this machine's own agent
      WATCHOVER_CORS: ${WATCHOVER_CORS:-}
      WATCHOVER_LLM_THREADS: ${WATCHOVER_LLM_THREADS:-}   # num_thread for the bundled Ollama (its CPU share; it would count the host's cores)
      WATCHOVER_PUBLIC_URL: ${WATCHOVER_PUBLIC_URL:-}   # the address colleagues open (./watchover.sh edge public NAME): sign-in callbacks, RUM snippet
      WATCHOVER_KEYD: ${WATCHOVER_KEYD:-tcp://keyd:8650}   # the action agent's key service (mutual TLS); its keys are never on /data
      WATCHOVER_KEYD_TLS: /secrets/keyd             # client certificate written by keyd on its first start
      WATCHOVER_VAULT_DIR: /secrets                 # the vault key moves here from /data once (outside /data backups, R3c)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - watchover-data:/data                        # settings, tokens, databases, live spool, version snapshots, logs
      - watchover-secrets:/secrets                  # vault key + keyd client certificate; not in /data, not in snapshots
      - watchover-updates:/updates                  # in-app updates: packages and requests in, the updater's state out (never the engine socket)
      # OAuth providers (Google / Microsoft / Apple / OIDC) are written by System › Sign-in into /app/.streamlit/secrets.toml;
      # to keep them across image updates add:  - ./secrets.toml:/app/.streamlit/secrets.toml   (create the file first)
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_CPUS:-4}"
          memory: ${WATCHOVER_MEMORY:-4g}
        reservations:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  keyd:                                           # watchover-keyd: signs jobs and anchors, MACs the audit chain (docs/design/action-agent.md §9.3.1)
    image: ${WATCHOVER_IMAGE:-watchover}:${WATCHOVER_TAG:-local}
    container_name: watchover-keyd
    command: ["python", "-m", "watchover.act.keyd", "serve", "--dir", "/keys/store", "--tcp", "0.0.0.0:8650", "--tls", "/keys/tls", "--client-out", "/secrets/keyd"]
    restart: unless-stopped                       # no published port: only the dashboard reaches it, with its client certificate
    healthcheck:                                  # its own: the image's check is the dashboard's (:8501) and always failed here
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8650), 3).close()\""]   # one shell string: Podman 4 (RHEL 8) splits CMD arguments at spaces
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - watchover-keys:/keys                        # its own volume: back it up separately (Otomasyon › Anahtarlar, two holders)
      - watchover-secrets:/secrets
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128m}
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  receiver:                                       # Go: answers agents in milliseconds whatever the dashboard is doing
    image: ${WATCHOVER_IMAGE:-watchover}-receiver:${WATCHOVER_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.receiver
    container_name: watchover-receiver
    restart: unless-stopped
    ports:
      - "${WATCHOVER_LIVE_PORT:-8600}:8600"        # agents, pull sources, agent installer
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      WO_UPSTREAM: http://dashboard:8601
      WO_MAX_BACKLOG_MB: ${WATCHOVER_SPOOL_MAX_MB:-2048}
      WO_PARSE_WORKERS: ${WATCHOVER_PARSE_WORKERS:-0}           # Go parse workers; 0 = every CPU the container may use
      WATCHOVER_GO_PARSE: ${WATCHOVER_GO_PARSE:-1}  # must match the dashboard's value
    depends_on:
      dashboard:
        condition: service_started
    volumes:
      - watchover-data:/data                        # /data/spool: segments for the dashboard, auth.json from the dashboard
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_RECEIVER_CPUS:-2}"
          memory: ${WATCHOVER_RECEIVER_MEMORY:-512m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8600/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp:
    profiles: [mcp]
    image: ${WATCHOVER_IMAGE:-watchover}:${WATCHOVER_TAG:-local}
    container_name: watchover-mcp
    command: ["python", "mcp_server.py", "--http", "--port", "8765"]
    restart: unless-stopped
    ports: ["${WATCHOVER_MCP_PORT:-8765}:8765"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
      MCP_API_KEY: ${MCP_API_KEY:-}                 # empty = open endpoint: keep the port on localhost or set a key
      WATCHOVER_DATASETS: /data/datasets
      WATCHOVER_API_URL: ${WATCHOVER_API_URL:-http://watchover:8501}   # also offer the live product's tools, forwarded to the dashboard's own /mcp
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - watchover-data:/data
      - ./datasets:/data/datasets:ro,z              # files that MCP clients analyse by relative name: analyze_dataset("log.zip")
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  legacy:
    profiles: [legacy]
    image: ${WATCHOVER_IMAGE:-watchover}:${WATCHOVER_TAG:-local}
    container_name: watchover-legacy
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8502", "--server.headless", "true", "--server.fileWatcherType", "none"]
    restart: unless-stopped
    ports: ["${WATCHOVER_LEGACY_PORT:-8502}:8502"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
      WATCHOVER_SELFMON: "0"
      LIVE_PORT: "8601"                            # its own receiver port: the product's receiver is on the dashboard container
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - watchover-data:/data
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  edge:
    profiles: [edge]
    image: nginx:1.30-alpine
    container_name: watchover-edge
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/watchover-start.sh"]  # OPENSSL_armcap on a CPU whose kernel reports SVE2 without SVE, then the image's entrypoint
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${WATCHOVER_EDGE_HTTPS_PORT:-443}:${WATCHOVER_EDGE_HTTPS_PORT:-443}"   # the only ports colleagues reach; UI / API and /ingest go through here
      - "${WATCHOVER_EDGE_HTTP_PORT:-80}:${WATCHOVER_EDGE_HTTP_PORT:-80}"       # redirect to https, and /healthz for a load balancer
    environment:
      WATCHOVER_EDGE_SERVER_NAMES: ${WATCHOVER_EDGE_SERVER_NAMES:-localhost}
      WATCHOVER_EDGE_HTTPS_PORT: ${WATCHOVER_EDGE_HTTPS_PORT:-443}
      WATCHOVER_EDGE_HTTP_PORT: ${WATCHOVER_EDGE_HTTP_PORT:-80}
      WATCHOVER_EDGE_CERT: /certs/watchover.crt     # this install's CA (scripts/edge-cert.sh) or a company certificate placed in ./certs
      WATCHOVER_EDGE_KEY: /certs/watchover.key
      WATCHOVER_EDGE_TRUSTED: ${WATCHOVER_EDGE_TRUSTED:-}   # load balancers whose X-Forwarded-For is believed (./watchover.sh edge lb)
      WATCHOVER_EDGE_TLS_MIN: ${WATCHOVER_EDGE_TLS_MIN:-1.2}   # 1.2 = TLS 1.2 + 1.3; 1.3 = TLS 1.3 only (./watchover.sh edge tls 1.3)
      NGINX_ENVSUBST_FILTER: ^WATCHOVER_EDGE_       # only these are filled into the template; nginx's own $variables stay
    volumes:
      - ./docker/nginx/watchover.conf.template:/etc/nginx/templates/watchover.conf.template:ro,z
      - ./docker/nginx/40-watchover-edge.sh:/docker-entrypoint.d/40-watchover-edge.sh:ro,z
      - ./docker/nginx/watchover-start.sh:/watchover-start.sh:ro,z
      - ./certs:/certs:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${WATCHOVER_EDGE_HTTP_PORT}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - dashboard
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }

  ollama:
    profiles: [llm]
    image: ${WATCHOVER_IMAGE:-watchover}-ollama:${WATCHOVER_TAG:-local}     # the Ollama release with its binary rebuilt (Dockerfile.ollama)
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: watchover-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${WATCHOVER_LLM_KEEPALIVE:-30m}       # keep a model resident this long between requests
      OLLAMA_NUM_PARALLEL: ${WATCHOVER_LLM_PARALLEL:-1}        # concurrent requests per model (CPU-only: keep low)
      OLLAMA_MAX_LOADED_MODELS: ${WATCHOVER_LLM_MAX_MODELS:-2} # chat + embeddings resident at once
      OMP_NUM_THREADS: ${WATCHOVER_LLM_THREADS:-4}             # CPU threads for inference (= the cpus limit below)
      HTTPS_PROXY: ${WATCHOVER_HTTPS_PROXY:-}                   # company proxy for model pulls (https only: no HTTP_PROXY, it would catch
      NO_PROXY: ${WATCHOVER_NO_PROXY:-}                         # the client-server calls); install-rhel.sh writes both to .env
    volumes:
      - watchover-ollama:/root/.ollama                        # downloaded models persist here; cache cleanup never touches them
      - watchover-models:/models:ro                           # adapters written by the trainer (legacy Modelfile import path)
    expose:
      - "11434"                                               # on the compose network as http://ollama:11434 (not published to the host)
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_LLM_CPUS:-4}"                    # watchover.sh sizes this to every CPU Docker sees (10 laptop, 32/64 server)
          memory: ${WATCHOVER_LLM_MEMORY:-8g}
        reservations:
          cpus: "1"
          memory: 2g
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  trainer:
    profiles: [llm]
    image: ${WATCHOVER_IMAGE:-watchover}-trainer:${WATCHOVER_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.trainer
    container_name: watchover-trainer
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-watchover}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-watchover}}
      OLLAMA_URL: http://ollama:11434
      WATCHOVER_TRAIN_THREADS: ${WATCHOVER_TRAIN_THREADS:-3}
      WATCHOVER_MODELS_DIR: /models
      HF_HUB_OFFLINE: ${WATCHOVER_OFFLINE:-0}                    # air-gapped (unbundle): never call huggingface.co, use the cached base weights
      TRANSFORMERS_OFFLINE: ${WATCHOVER_OFFLINE:-0}
      HTTPS_PROXY: ${WATCHOVER_HTTPS_PROXY:-}                   # company proxy for the base weights (Hugging Face, https); empty = direct
      NO_PROXY: ${WATCHOVER_NO_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - watchover-data:/data                                    # settings (auto-learn switches), the run-now flag, live spool for the quality gate
      - watchover-hf:/hf                                        # base weights cache (downloaded once)
      - watchover-models:/models                                # adapters + Modelfiles, also visible to Ollama for the legacy import path
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_TRAIN_CPUS:-4}"                    # sized to the machine by watchover.sh; training is periodic, idle otherwise
          memory: ${WATCHOVER_TRAIN_MEMORY:-6g}
        reservations:
          cpus: "0.25"
          memory: 256m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  updater:                                        # in-app updates (Sistem › Güncelleme): the ONLY container with the engine socket
    profiles: [updater]                           # started by watchover.sh when WATCHOVER_UPDATER=1 (the default); ./watchover.sh updater off
    image: ${WATCHOVER_IMAGE:-watchover}-updater:${WATCHOVER_UPDATER_TAG:-4}   # tools only; the logic runs from the install folder
    build:
      context: .
      dockerfile: Dockerfile.updater
    container_name: watchover-updater
    command: ["sh", "-c", "exec python3 \"$$WATCHOVER_INSTALL_DIR/src/watchover/updater.py\" daemon"]
    restart: unless-stopped
    network_mode: none                            # no network, no port: the engine through its socket, the dashboard through the spool volume
    working_dir: ${WATCHOVER_INSTALL_DIR:-/install}
    environment:
      TZ: ${TZ:-Europe/Istanbul}
      WATCHOVER_INSTALL_DIR: ${WATCHOVER_INSTALL_DIR:-/install}
      WATCHOVER_IN_UPDATER: "1"                     # watchover.sh: never recreate this container, host-only checks skipped
      WATCHOVER_UPDATES_DIR: /updates
      WATCHOVER_ENGINE: ${WATCHOVER_ENGINE:-docker}
      WATCHOVER_PODMAN_SOCK: ${WATCHOVER_ENGINE_SOCK:-/var/run/docker.sock}
      DOCKER_HOST: unix://${WATCHOVER_ENGINE_SOCK:-/var/run/docker.sock}
      CONTAINER_HOST: unix://${WATCHOVER_ENGINE_SOCK:-/var/run/docker.sock}   # podman client in remote mode (Podman installs)
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind                                # Docker (/var/run/docker.sock; Docker Desktop maps it to its VM) or rootful Podman's socket:
        source: ${WATCHOVER_ENGINE_SOCK:-/var/run/docker.sock}   # whoever holds it is root on this host (docs/KURULUM_DOCKER.md, 3b)
        target: ${WATCHOVER_ENGINE_SOCK:-/var/run/docker.sock}
      - type: bind                                # the install folder at the same absolute path: compose resolves ./certs, ./datasets as on the host
        source: ${WATCHOVER_INSTALL_DIR:-.}
        target: ${WATCHOVER_INSTALL_DIR:-/install}
      - watchover-updates:/updates
    security_opt: ["label=disable"]               # SELinux (RHEL): reaching the engine socket needs it; nothing gets relabelled
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "find /updates/updater.json -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  postgres:
    image: ${WATCHOVER_IMAGE:-watchover}-postgres:${WATCHOVER_TAG:-local}   # postgres:16-alpine with su-exec for gosu (Dockerfile.postgres)
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: watchover-postgres
    restart: unless-stopped
    ports:
      - "${WATCHOVER_PG_PORT:-127.0.0.1:5433}:5432"   # host-side access for psql / backups only (not exposed beyond localhost)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchover}
      POSTGRES_USER: ${POSTGRES_USER:-watchover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}     # set a real one in .env before the first start
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command: ["postgres", "-c", "shared_buffers=${WATCHOVER_PG_SHARED_BUFFERS:-128MB}", "-c", "effective_cache_size=${WATCHOVER_PG_CACHE:-4GB}"]   # ./watchover.sh profile sets these (defaults = PostgreSQL's own)
    volumes:
      - watchover-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchover} -d ${POSTGRES_DB:-watchover}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          cpus: "${WATCHOVER_PG_CPUS:-2}"
          memory: ${WATCHOVER_PG_MEMORY:-2g}

volumes:
  watchover-data:
  watchover-keys:                                 # watchover-keyd only (I17)
  watchover-secrets:                              # vault key and keyd's client certificate
  watchover-updates:                              # in-app update spool shared by the dashboard and the updater (packages, requests, state)
  watchover-pg:
  watchover-ollama:
  watchover-hf:
  watchover-models:
